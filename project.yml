name: ClaudeRemote
options:
  bundleIdPrefix: com.ducle
  deploymentTarget:
    iOS: "16.0"
targets:
  ClaudeRemote:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ducle.clauderemote
        PRODUCT_NAME: ClaudeRemote
        MARKETING_VERSION: "4.1"
        CURRENT_PROJECT_VERSION: "29"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Claude Remote"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [location]
        NSLocationAlwaysAndWhenInUseUsageDescription: "Chọn \"Luôn luôn\" để app chạy ngầm và báo khi Claude / agy làm xong. App không lưu hay gửi vị trí của bạn đi đâu."
        NSLocationWhenInUseUsageDescription: "App dùng quyền vị trí chỉ để được chạy ngầm và báo khi Claude / agy làm xong. Vị trí không được lưu hay gửi đi."
        NSLocationDefaultAccuracyReduced: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ClaudeRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ClaudeRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  ClaudeRemote:
    build:
      targets:
        ClaudeRemote: all
    test:
      targets:
        - ClaudeRemoteTests
